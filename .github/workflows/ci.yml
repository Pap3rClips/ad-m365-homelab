name: CI

on:
  push:
  pull_request:

jobs:
  qualite:
    name: Analyse statique et tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Installer PSScriptAnalyzer et Pester
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -MinimumVersion 1.22.0 -Scope CurrentUser
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -SkipPublisherCheck

      - name: PSScriptAnalyzer
        run: |
          $results = foreach ($dir in 'scripts', 'modules') {
            Invoke-ScriptAnalyzer -Path $dir -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          }
          $results | Format-Table ScriptName, Line, RuleName, Message -AutoSize -Wrap
          if ($results) { throw "$(@($results).Count) problème(s) détecté(s)" }

      - name: Pester
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'test-results.xml'
          Invoke-Pester -Configuration $config

      - name: Publier les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
